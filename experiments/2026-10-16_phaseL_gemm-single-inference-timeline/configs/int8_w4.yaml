# One captured action chunk; A8/W8 VLM (including vision/connector), A8/W4 expert Linear.
# QK/PV use A8/B8 in every component. Action-head Linear GEMMs retain actual FP container widths.
output_dir: outputs/2026-10-16_phaseL_gemm-single-inference-timeline/int8_w4
model:
  type: smolvla
  path: lerobot/smolvla_libero
  revision: a24f1f380461b665158d52acd140152c79e8b36d
  device: cuda
  overrides:
    n_action_steps: 50
    num_steps: 10
quantization:
  enabled: true
  mode: quant_forward
  method: per_tensor
  scale_dir: scales/2026-10-16_phaseL_gemm-single-inference-timeline/int8_w4
  outlier_ratio: 0.0
  mixed_precision: false
  dynamic_activation: false
  quantize_matmul: true
  matmul_scale_granularity: per_site
  linear_scale_granularity: per_site
  weight_quant_granularity: per_tensor
  calibration_policy:
    default: recalibrate
  q_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  k_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  v_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  o_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  gate_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  up_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  down_proj:
    a_bit: 8
    w_bit: 8
    o_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  qk_matmul:
    A_bit: 8
    B_bit: 8
    O_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  pv_matmul:
    A_bit: 8
    B_bit: 8
    O_bit: 8
    d_bit: 4
    p: 4
    outlier_ratio: 0.0
  vision:
    enabled: true
    calibration_policy: recalibrate
    linear:
      mlp: true
      attn_proj: true
    matmul:
      enabled: true
      calibration_policy: recalibrate
  connector:
    enabled: true
    calibration_policy: recalibrate
  linear:
    enabled: true
    include:
    - vision.*
    - connector.*
    - vlm.*
    - expert.*
    exclude: []
    overrides:
    - name: expert_int4_weights
      target:
        component: expert
      config:
        a_bit: 8
        w_bit: 4
        o_bit: 8
        method: per_tensor
        outlier_ratio: 0.0
sparsity:
  enabled: false
experiment:
  seed: 42
  prompt: Pick up the black bowl and place it on the plate.
hardware:
  backend: component_sim
  max_events: 0
  mapping:
    tile_m: 64
    tile_n: 64
    tile_k: 128
    dataflow: output_stationary
  backend_config:
    architecture:
      schema_version: 1
      clock_hz: 1000000000.0
      components:
        dram:
          type: dram
          bandwidth_bytes_per_second: 102400000000.0
          efficiency: 0.7
          latency_cycles: 100
          burst_bytes: 64
        dma:
          type: dma
          bytes_per_cycle: 256
        noc:
          type: link
          bytes_per_cycle: 256
        operand_link:
          type: link
          bytes_per_cycle: 256
        accumulator_link:
          type: link
          bytes_per_cycle: 256
        gb:
          type: sram
          capacity_bytes: 4194304
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        local:
          type: sram
          capacity_bytes: 131072
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        acc:
          type: sram
          capacity_bytes: 65536
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        array:
          type: compute_array
          rows: 32
          cols: 32
          pipeline_cycles: 0
          accumulator_bits: 32
          supported_formats:
          - int4
          - int8
          - int12
          - int16
          - float16
          - bfloat16
          - float32
          - e2m1
          - e4m3
          - e4m3fn
          - e5m2
          - e5m10
          mode: dense
      roles:
        dram: dram
        global: gb
        local: local
        accumulator: acc
        array: array
      connections:
      - from: dram.data
        to: gb.data
        via: dma
      - from: gb.data
        to: dram.data
        via: dma
      - from: gb.data
        to: local.data
        via: noc
      - from: acc.data
        to: gb.data
        via: noc
      - from: local.data
        to: array.data
        via: operand_link
      - from: array.data
        to: acc.data
        via: accumulator_link
      - from: acc.data
        to: array.data
        via: accumulator_link
      - from: gb.data
        to: acc.data
        via: noc
    double_buffer: true
    max_plan_events: 200000
    save_plan: false
  mapping_search:
    enabled: false
  enabled: true
