# Raw registered Linear capture; functional attention/SDPA are outside coverage.
output_dir: outputs/2026-09-22_phaseJ_hardware-framework/hw0_raw
model:
  type: smolvla
  path: lerobot/smolvla_libero
  device: cuda
  revision: null
  overrides:
    n_action_steps: 10
    num_steps: 10
quantization:
  enabled: false
evaluation:
  env:
    type: libero
    task: libero_goal
    max_parallel_tasks: 1
    task_ids: [0]
  n_episodes: 1
  batch_size: 1
  use_async_envs: false
  seed: 1000
  max_episodes_rendered: 0
  rename_map:
    observation.images.image: observation.images.camera1
    observation.images.image2: observation.images.camera2
sparsity:
  enabled: false
# Archived workload configuration, re-evaluated by the current component model.
hardware:
  enabled: true
  backend: component_sim
  max_events: 20000
  mapping:
    tile_m: 16
    tile_n: 16
    tile_k: 64
    dataflow: output_stationary
  backend_config:
    architecture:
      schema_version: 1
      clock_hz: 1000000000
      components:
        dram:
          type: dram
          bandwidth_bytes_per_second: 32000000000
          efficiency: 1.0
          latency_cycles: 0
          burst_bytes: 1
        dma:
          type: dma
          bytes_per_cycle: 256
        noc:
          type: link
          bytes_per_cycle: 256
        operand_link:
          type: link
          bytes_per_cycle: 256
        accumulator_link:
          type: link
          bytes_per_cycle: 256
        gb:
          type: sram
          capacity_bytes: 262144
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        local:
          type: sram
          capacity_bytes: 262144
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        acc:
          type: sram
          capacity_bytes: 262144
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        array:
          type: compute_array
          rows: 16
          cols: 16
          pipeline_cycles: 0
          accumulator_bits: 32
          supported_formats:
          - int4
          - int8
          - int12
          - int16
          - float16
          - bfloat16
          - float32
          - e2m1
          - e4m3
          - e4m3fn
          - e5m2
          - e5m10
      roles:
        dram: dram
        global: gb
        local: local
        accumulator: acc
        array: array
      connections:
      - from: dram.data
        to: gb.data
        via: dma
      - from: gb.data
        to: dram.data
        via: dma
      - from: gb.data
        to: local.data
        via: noc
      - from: acc.data
        to: gb.data
        via: noc
      - from: local.data
        to: array.data
        via: operand_link
      - from: array.data
        to: acc.data
        via: accumulator_link
      - from: acc.data
        to: array.data
        via: accumulator_link
      - from: gb.data
        to: acc.data
        via: noc
    double_buffer: false
