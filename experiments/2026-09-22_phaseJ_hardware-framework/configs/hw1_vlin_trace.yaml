output_dir: outputs/2026-09-22_phaseJ_hardware-framework/hw1_vlin_trace

model:
  type: smolvla
  path: lerobot/smolvla_libero
  device: cuda
  revision: null
  overrides:
    n_action_steps: 10
    num_steps: 10

quantization:
  enabled: true
  mode: quant_forward
  method: pot_fp8_outlier
  scale_dir: scales/2026-09-15_phaseI_vision-quantization/vlin_full_vision_linear_fp8

  # Existing VLM/Expert QK/PV only. Vision attention remains SDPA.
  quantize_matmul: true
  matmul_scale_granularity: per_site
  linear_scale_granularity: per_site
  outlier_ratio: 0.01

  # Characterization run: every quantized site reuses the already-calibrated
  # VLIN scales. The runner also hard-requires --skip-calibration.
  calibration_policy:
    default: reuse
    layer_policy:
      q_proj: reuse
      k_proj: reuse
      v_proj: reuse
      o_proj: reuse
      gate_proj: reuse
      up_proj: reuse
      down_proj: reuse
      qk_matmul: reuse
      pv_matmul: reuse
    per_layer_policy: {}

  q_proj: &linear_fp8
    a_bit: e4m3
    w_bit: e4m3
    o_bit: e4m3
    d_bit: 4
    outlier_ratio: 0.01
    p: 4
  k_proj: *linear_fp8
  v_proj: *linear_fp8
  o_proj: *linear_fp8
  gate_proj: *linear_fp8
  up_proj: *linear_fp8
  down_proj: *linear_fp8

  qk_matmul: &matmul_fp8
    A_bit: e4m3
    B_bit: e4m3
    O_bit: e4m3
    d_bit: 4
    outlier_ratio: 0.01
    p: 4
  pv_matmul: *matmul_fp8

  vision:
    enabled: true
    calibration_policy: reuse
    linear:
      mlp: true
      attn_proj: true

  connector:
    enabled: false

  linear:
    enabled: true
    include:
      - vlm.*
      - expert.*
      - vision.*
    exclude: []
    overrides:
      - name: vision_linear_fp8
        target:
          component: vision
        config:
          a_bit: e4m3
          w_bit: e4m3
          o_bit: e4m3
          d_bit: 4
          p: 4
          outlier_ratio: 0.01
          method: pot_fp8_outlier

  weight_quant_granularity: per_tensor
  weight_group_size: null

calibration:
  dataset_repo_id: HuggingFaceVLA/libero
  dataset_revision: v3.0
  episodes: 8
  batch_size: 8
  frame_stride: 4
  seed: 42

evaluation:
  env:
    type: libero
    task: libero_goal
    max_parallel_tasks: 1
    task_ids:
      - 0
  n_episodes: 1
  batch_size: 1
  use_async_envs: false
  seed: 1000
  max_episodes_rendered: 0
  rename_map:
    observation.images.image: observation.images.camera1
    observation.images.image2: observation.images.camera2

sparsity:
  enabled: false
  # H100-friendly; unit sparsity is intentionally disabled for the primary
  # element/bit sparsity scan, so the run should remain lightweight.
  chunk_size: 4194304
  unit:
    enabled: false
  export:
    dir: null

# Metadata capture only: outlier events are traced but not assigned latency.
# Archived workload configuration, re-evaluated by the current component model.
hardware:
  enabled: true
  backend: component_sim
  max_events: 20000
  mapping:
    tile_m: 16
    tile_n: 16
    tile_k: 64
    dataflow: output_stationary
  backend_config:
    architecture:
      schema_version: 1
      clock_hz: 1000000000
      components:
        dram:
          type: dram
          bandwidth_bytes_per_second: 32000000000
          efficiency: 1.0
          latency_cycles: 0
          burst_bytes: 1
        dma:
          type: dma
          bytes_per_cycle: 256
        noc:
          type: link
          bytes_per_cycle: 256
        operand_link:
          type: link
          bytes_per_cycle: 256
        accumulator_link:
          type: link
          bytes_per_cycle: 256
        gb:
          type: sram
          capacity_bytes: 262144
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        local:
          type: sram
          capacity_bytes: 262144
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        acc:
          type: sram
          capacity_bytes: 262144
          read_bytes_per_cycle: 256
          write_bytes_per_cycle: 256
        array:
          type: compute_array
          rows: 16
          cols: 16
          pipeline_cycles: 0
          accumulator_bits: 32
          supported_formats:
          - int4
          - int8
          - int12
          - int16
          - float16
          - bfloat16
          - float32
          - e2m1
          - e4m3
          - e4m3fn
          - e5m2
          - e5m10
      roles:
        dram: dram
        global: gb
        local: local
        accumulator: acc
        array: array
      connections:
      - from: dram.data
        to: gb.data
        via: dma
      - from: gb.data
        to: dram.data
        via: dma
      - from: gb.data
        to: local.data
        via: noc
      - from: acc.data
        to: gb.data
        via: noc
      - from: local.data
        to: array.data
        via: operand_link
      - from: array.data
        to: acc.data
        via: accumulator_link
      - from: acc.data
        to: array.data
        via: accumulator_link
      - from: gb.data
        to: acc.data
        via: noc
    double_buffer: false
