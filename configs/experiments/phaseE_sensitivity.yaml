# Phase E — Sensitivity（闭环 SR）示例配置
#
# 只对「一个」物理 site 注入噪声（test_forward），其余全部 raw，
# 从而严格测出该 site 的敏感度（closed-loop SR）。
#
# 用法（先用 per_site 校准出 scale，再复用 scale 做 quant_residual 注入）：
#   1) 校准（若用 gaussian 方法可跳过）：
#        python main.py --config configs/experiments/phaseE_sensitivity.yaml --skip-evaluation
#   2) 评测（注入噪声后的 SR）：
#        python main.py --config configs/experiments/phaseE_sensitivity.yaml --skip-calibration
#
# 更换 target 只需改 test.target.module_id（或 component/layer/operator）。

output_dir: outputs/experiments/phaseE_sensitivity

model:
  type: smolvla
  path: lerobot/smolvla_libero
  device: cuda
  revision: null
  overrides:
    n_action_steps: 10
    num_steps: 10

quantization:
  enabled: true
  mode: quant_forward
  method: pot_fp8_outlier
  scale_dir: scales/phaseE_sensitivity
  quantize_matmul: true
  matmul_scale_granularity: per_site
  linear_scale_granularity: per_site
  outlier_ratio: 0.01
  calibration_policy:
    default: auto
    layer_policy:
      q_proj: recalibrate
      k_proj: recalibrate
      v_proj: recalibrate
      o_proj: recalibrate
      gate_proj: recalibrate
      up_proj: recalibrate
      down_proj: recalibrate
      qk_matmul: recalibrate
      pv_matmul: recalibrate
    per_layer_policy: {}
  q_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  k_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  v_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  o_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  gate_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  up_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  down_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  qk_matmul: { A_bit: e4m3, B_bit: e4m3, O_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  pv_matmul: { A_bit: e4m3, B_bit: e4m3, O_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  linear:
    enabled: true
    include: ["*"]
    exclude: []

# ----------------------------------------------------------------------
# Sensitivity target（Phase E）
# 只打 expert.layer.7.qk 这个 MatMul；其余 raw。
# 也可换成 selector：
#   target: { component: expert, operator: qk }
#   target: { component: vlm, operator: down_proj, layer: [0,1,2,3] }
# ----------------------------------------------------------------------
test:
  enabled: true
  method: gaussian_rms_output   # gaussian_rms_{input|weight|output} / quant_residual_*
  alpha: 0.03
  seed: 0
  site: output                  # Linear: input|weight|output ; MatMul: A|B|output
  use_outlier_protection: false
  residual_lambda: 1.0
  outlier_ratio: 0.01
  target:
    module_id: expert.layer.7.qk

calibration:
  dataset_repo_id: HuggingFaceVLA/libero
  dataset_revision: v3.0
  episodes: 8
  batch_size: 8
  frame_stride: 4
  seed: 42

evaluation:
  env:
    type: libero
    task: libero_object
    max_parallel_tasks: 1
  n_episodes: 10
  batch_size: 1
  use_async_envs: false
  seed: 1000
  max_episodes_rendered: 0
  rename_map:
    observation.images.image: observation.images.camera1
    observation.images.image2: observation.images.camera2
