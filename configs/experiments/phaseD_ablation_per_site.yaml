# Phase D — MatMul/Linear scale granularity ablation（真实 LIBERO 校准 + 评测）
#
# 目标：把「scale 元数据量 ↔ 闭环 SR」的关系正式量化。
# 四种粒度共用同一套 pot_fp8_outlier 量化协议，唯一差异是 scale 共享粒度。
#
# 用法（每个粒度一个 scale_dir，禁止混用）：
#   python main.py --config configs/experiments/phaseD_ablation_per_site.yaml
#   python main.py --config configs/experiments/phaseD_ablation_per_layer.yaml
#   python main.py --config configs/experiments/phaseD_ablation_per_component.yaml
#   python main.py --config configs/experiments/phaseD_ablation_global.yaml
#
# 或一键跑完 4 档：
#   bash scripts/run_phaseD_ablation.sh
#
# 预期 scale 文件数（MatMul + Linear）：
#   per_site       192 + 672 = 864
#   per_layer       96 + 336 = 432
#   per_component   12 +  42 =  54
#   global           6 +  21 =  27

output_dir: outputs/experiments/phaseD_ablation_per_site

model:
  type: smolvla
  path: lerobot/smolvla_libero
  device: cuda
  revision: null
  overrides:
    n_action_steps: 10
    num_steps: 10

quantization:
  enabled: true
  mode: quant_forward

  method: pot_fp8_outlier

  scale_dir: scales/phaseD_ablation_per_site

  quantize_matmul: true

  # ★ 粒度差异点
  matmul_scale_granularity: per_site
  linear_scale_granularity: per_site

  outlier_ratio: 0.01

  calibration_policy:
    default: auto
    layer_policy:
      q_proj: recalibrate
      k_proj: recalibrate
      v_proj: recalibrate
      o_proj: recalibrate
      gate_proj: recalibrate
      up_proj: recalibrate
      down_proj: recalibrate
      qk_matmul: recalibrate
      pv_matmul: recalibrate
    per_layer_policy: {}

  q_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  k_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  v_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  o_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  gate_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  up_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  down_proj: { a_bit: e4m3, w_bit: e4m3, o_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  qk_matmul: { A_bit: e4m3, B_bit: e4m3, O_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }
  pv_matmul: { A_bit: e4m3, B_bit: e4m3, O_bit: e4m3, d_bit: 4, outlier_ratio: 0.01, p: 4 }

  linear:
    enabled: true
    include: ["*"]
    exclude: []

calibration:
  dataset_repo_id: HuggingFaceVLA/libero
  dataset_revision: v3.0
  episodes: 8
  batch_size: 8
  frame_stride: 4
  seed: 42

evaluation:
  env:
    type: libero
    task: libero_object
    max_parallel_tasks: 1
  n_episodes: 10
  batch_size: 1
  use_async_envs: false
  seed: 1000
  max_episodes_rendered: 0
  rename_map:
    observation.images.image: observation.images.camera1
    observation.images.image2: observation.images.camera2
